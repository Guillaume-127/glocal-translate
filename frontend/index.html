<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glocal Translate & Prompt Enhancer</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <header>
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l6 6"/><path d="M4 14l6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="M22 22l-5-10-5 10"/><path d="M14 18h6"/></svg>
                <h1>Glocal Translate</h1>
            </div>

            <!-- PROMINENT NAVIGATION TABS -->
            <nav class="nav-tabs">
                <button id="tab-translate" class="tab-btn active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                    🌐 Traducteur
                </button>
                <button id="tab-enhancer" class="tab-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    ✨ Prompt Enhancer
                </button>
            </nav>

            <div class="status-indicator">
                <span id="status-dot" class="dot connected"></span>
                <span id="status-text">Prêt</span>
            </div>
        </header>

        <!-- VIEW 1: TRANSLATION BOARD -->
        <main id="view-translate" class="translation-board">
            <!-- Source Panel -->
            <div class="panel source-panel">
                <div class="panel-header">
                    <select id="source-lang" class="lang-select">
                        <option value="Français" selected>Français</option>
                        <option value="English">Anglais</option>
                    </select>
                </div>
                <div class="text-area-wrapper">
                    <textarea id="source-text" placeholder="Saisissez du texte ici... (Traduction non-censurée & fidèle)"></textarea>
                    
                    <!-- Suggestion Bubble -->
                    <div id="suggestion-box" class="suggestion-box hidden">
                        <span class="suggestion-tag">Suggestion</span>
                        <span id="suggestion-text">...</span>
                        <button id="accept-suggestion-btn" title="Accepter la suggestion (Tab)">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        </button>
                    </div>

                    <!-- Grammar / Spelling Correction Proposal Banner -->
                    <div id="correction-box" class="correction-box hidden">
                        <span class="correction-icon">💡</span>
                        <span class="correction-label">Correction suggérée :</span>
                        <span id="correction-text" class="correction-text"></span>
                        <button id="apply-correction-btn" class="correction-btn">Corriger la phrase</button>
                    </div>
                </div>
                <div class="panel-footer">
                    <span id="char-count">0 / 5000</span>
                </div>
            </div>

            <!-- Swap Button -->
            <button id="swap-lang-btn" class="swap-btn" title="Inverser les langues">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="M16 21l4-4-4-4"/><path d="M20 17H4"/></svg>
            </button>

            <!-- Target Panel -->
            <div class="panel target-panel">
                <div class="panel-header">
                    <select id="target-lang" class="lang-select">
                        <option value="Français">Français</option>
                        <option value="English" selected>Anglais</option>
                    </select>
                </div>
                <div class="text-area-wrapper">
                    <textarea id="target-text" readonly placeholder="La traduction apparaîtra ici..."></textarea>
                    <div id="loading-overlay" class="loading-overlay hidden">
                        <div class="spinner"></div>
                    </div>
                </div>
                <div class="panel-footer right-align">
                    <button id="copy-btn" class="icon-btn" title="Copier la traduction">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                </div>
            </div>
        </main>

        <!-- VIEW 2: PROMPT ENHANCER BOARD -->
        <main id="view-enhancer" class="enhancer-board hidden">
            <!-- Source Prompt Input Panel -->
            <div class="panel enhancer-panel">
                <div class="panel-header">
                    <div class="mode-selector-wrapper">
                        <label for="enhancer-type">Style de Prompt :</label>
                        <select id="enhancer-type" class="lang-select">
                            <option value="image" selected>🎨 Image AI (Midjourney, Flux, SD)</option>
                            <option value="llm">🤖 Prompt Système / LLM (ChatGPT, Claude)</option>
                            <option value="creative">📝 Expansion Créative / Texte</option>
                        </select>
                    </div>
                </div>
                <div class="text-area-wrapper">
                    <textarea id="enhancer-input" placeholder="Décrivez votre idée brute ou prompt court ici (ex: 'Un chat samouraï dans une ville cyberpunk sous la pluie')..."></textarea>
                </div>
                <div class="panel-footer right-align">
                    <button id="enhance-btn" class="primary-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                        Améliorer le Prompt
                    </button>
                </div>
            </div>

            <!-- Enhanced Output Panel -->
            <div class="panel enhancer-panel">
                <div class="panel-header">
                    <span class="panel-title">Prompt Amélioré & Optimisé</span>
                </div>
                <div class="text-area-wrapper">
                    <textarea id="enhancer-output" readonly placeholder="Le prompt optimisé prêt à l'emploi apparaîtra ici..."></textarea>
                    <div id="enhancer-loading" class="loading-overlay hidden">
                        <div class="spinner"></div>
                    </div>
                </div>
                <div class="panel-footer right-align">
                    <button id="copy-enhancer-btn" class="icon-btn" title="Copier le prompt amélioré">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
